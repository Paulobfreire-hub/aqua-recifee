<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqua Recife - Monitoramento de Perdas</title>
    <!-- React e ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para compilar JSX no browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS para estilização limpa e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-mono">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const SENSORS_INIT = [
            { id: 'SN-101', name: 'Sensor Fluvial 01 - Zona Sul', region: 'Boa Viagem', flow: 142.5, pressure: 28.4, status: 'NORMAL' },
            { id: 'SN-102', name: 'Macromedidor Várzea Norte', region: 'Várzea', flow: 188.0, pressure: 14.2, status: 'CRITICAL' },
            { id: 'SN-103', name: 'Pressostato Santo Amaro C', region: 'Santo Amaro', flow: 98.2, pressure: 22.1, status: 'WARNING' },
            { id: 'SN-104', name: 'Medidor Espinheiro Leste', region: 'Espinheiro', flow: 115.4, pressure: 26.8, status: 'NORMAL' },
            { id: 'SN-105', name: 'Sensor Vazão Casa Amarela', region: 'Casa Amarela', flow: 210.1, pressure: 18.9, status: 'CRITICAL' }
        ];

        const REPAIRS_INIT = [
            { id: 'REP-8901', sensorId: 'SN-102', region: 'Várzea', type: 'Ruptura Tubulação Base PEAD', priority: 'Alta', status: 'Em Execução' },
            { id: 'REP-8902', sensorId: 'SN-105', region: 'Casa Amarela', type: 'Vazamento Subterrâneo Junta', priority: 'Crítica', status: 'Pendente' }
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [sensors, setSensors] = useState(SENSORS_INIT);
            const [repairs, setRepairs] = useState(REPAIRS_INIT);
            const [newRepair, setNewRepair] = useState({ type: '' });

            const criticalCount = sensors.filter(s => s.status === 'CRITICAL').length;
            const warningCount = sensors.filter(s => s.status === 'WARNING').length;

            const toggleAnomaly = (id) => {
                setSensors(prev => prev.map(s => {
                    if (s.id === id) {
                        const nextStatus = s.status === 'NORMAL' ? 'WARNING' : s.status === 'WARNING' ? 'CRITICAL' : 'NORMAL';
                        return { ...s, status: nextStatus };
                    }
                    return s;
                }));
            };

            const handleCreateRepair = (e) => {
                e.preventDefault();
                if (!newRepair.type) return;
                const item = {
                    id: `REP-${Math.floor(1000 + Math.random() * 9000)}`,
                    type: newRepair.type,
                    status: 'Pendente'
                };
                setRepairs([item, ...repairs]);
                setNewRepair({ type: '' });
            };

            const updateRepairStatus = (id, newStatus) => {
                setRepairs(prev => prev.map(r => r.id === id ? { ...r, status: newStatus } : r));
            };

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
                    <header className="border-b border-slate-800 bg-slate-900 px-6 py-4 flex justify-between items-center">
                        <div>
                            <h1 className="text-lg font-bold">AQUA RECIFE — MONITORAMENTO DE REDE</h1>
                            <p className="text-xs text-slate-400">Sistema de Telemetria e Perdas de Água | AV1</p>
                        </div>
                        <div className="text-xs text-red-400 font-semibold">
                            ALERTAS CRÍTICOS: {criticalCount}
                        </div>
                    </header>

                    <nav className="border-b border-slate-800 bg-slate-900/50 px-6 flex gap-2 overflow-x-auto">
                        {[
                            { id: 'dashboard', label: 'DASHBOARD' },
                            { id: 'sensors', label: 'SENSORES' },
                            { id: 'repairs', label: 'MANUTENÇÃO (O.S.)' },
                            { id: 'hotspots', label: 'SETORES' },
                            { id: 'reports', label: 'RELATÓRIO' }
                        ].map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`px-4 py-3 text-xs font-medium border-b-2 transition-colors whitespace-nowrap ${
                                    activeTab === tab.id 
                                        ? 'border-blue-500 text-blue-400' 
                                        : 'border-transparent text-slate-400 hover:text-slate-200'
                                }`}
                            >
                                {tab.label}
                            </button>
                        ))}
                    </nav>

                    <main className="p-6 max-w-7xl mx-auto w-full flex-1">
                        {activeTab === 'dashboard' && (
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                <div className="bg-slate-900 border border-slate-800 p-4 rounded">
                                    <span className="text-xs text-slate-400">PERDA ESTIMADA (L/s)</span>
                                    <div className="text-2xl font-bold text-red-400 mt-1">428.5 L/s</div>
                                </div>
                                <div className="bg-slate-900 border border-slate-800 p-4 rounded">
                                    <span className="text-xs text-slate-400">PRESSÃO MÉDIA</span>
                                    <div className="text-2xl font-bold text-sky-400 mt-1">22.1 mca</div>
                                </div>
                                <div className="bg-slate-900 border border-slate-800 p-4 rounded">
                                    <span className="text-xs text-slate-400">ANOMALIAS ATIVAS</span>
                                    <div className="text-2xl font-bold text-amber-400 mt-1">{criticalCount + warningCount}</div>
                                </div>
                                <div className="bg-slate-900 border border-slate-800 p-4 rounded">
                                    <span className="text-xs text-slate-400">META AV1</span>
                                    <div className="text-2xl font-bold text-emerald-400 mt-1">-30.0%</div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'sensors' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                {sensors.map(s => (
                                    <div key={s.id} className="bg-slate-900 border border-slate-800 p-4 rounded flex flex-col justify-between">
                                        <div>
                                            <h4 className="font-bold text-sm mb-1">{s.name}</h4>
                                            <p className="text-xs text-slate-400 mb-2">Região: {s.region}</p>
                                            <p className="text-xs mb-4">Status: <span className={`font-bold ${s.status === 'CRITICAL' ? 'text-red-450 text-red-400' : s.status === 'WARNING' ? 'text-amber-400' : 'text-emerald-400'}`}>{s.status}</span></p>
                                        </div>
                                        <button 
                                            onClick={() => toggleAnomaly(s.id)}
                                            className="w-full py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs rounded transition-colors"
                                        >
                                            Alternar Status (Simulação)
                                        </button>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'repairs' && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                <form onSubmit={handleCreateRepair} className="bg-slate-900 border border-slate-800 p-4 rounded h-fit">
                                    <h3 className="text-sm font-bold mb-4">Abrir Ordem de Serviço</h3>
                                    <input 
                                        type="text" 
                                        placeholder="Descrição do problema (ex: Vazamento...)" 
                                        value={newRepair.type}
                                        onChange={e => setNewRepair({type: e.target.value})}
                                        className="w-full bg-slate-950 border border-slate-700 text-slate-100 p-2 text-xs rounded mb-4 focus:outline-none focus:border-blue-500"
                                        required
                                    />
                                    <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white py-2 text-xs font-bold rounded transition-colors">
                                        Salvar O.S.
                                    </button>
                                </form>
                                <div className="lg:col-span-2 bg-slate-900 border border-slate-800 p-4 rounded">
                                    <h3 className="text-sm font-bold mb-4">Histórico de O.S.</h3>
                                    <div className="space-y-3">
                                        {repairs.map(r => (
                                            <div key={r.id} className="border-b border-slate-800 pb-3 flex justify-between items-center text-xs">
                                                <div>
                                                    <span className="font-bold text-blue-400">{r.id}</span> - {r.type} 
                                                    <span className="ml-2 text-slate-400">({r.status})</span>
                                                </div>
                                                {r.status !== 'Concluído' && (
                                                    <button onClick={() => updateRepairStatus(r.id, 'Concluído')} className="bg-emerald-800 hover:bg-emerald-700 text-white px-3 py-1 rounded transition-colors">
                                                        Concluir
                                                    </button>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'hotspots' && (
                            <div className="bg-slate-900 border border-slate-800 p-6 rounded">
                                <h3 className="text-base font-bold mb-2">Bairros Piloto Monitorados</h3>
                                <p className="text-sm text-slate-400">Boa Viagem, Várzea, Santo Amaro, Espinheiro, Casa Amarela.</p>
                            </div>
                        )}

                        {activeTab === 'reports' && (
                            <div className="bg-slate-900 border border-slate-800 p-6 rounded">
                                <h3 className="text-base font-bold mb-2">Relatório Executivo AV1</h3>
                                <p className="text-sm text-slate-400 leading-relaxed">Sistema desenvolvido para simulação de telemetria, indicadores de perda e gestão de ordens de serviço na rede de distribuição de água da Região Metropolitana do Recife.</p>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
